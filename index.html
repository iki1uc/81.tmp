<script type="module">
import * as K81 from "./JS/3x81.js";
import * as Rings5D from "./JS/AtomRings5D.js";
import * as Orbit from "./JS/Orbit48D.js";
import * as ZAxis from "./JS/Z.axis.js";
import * as VAxis from "./JS/V.axis.js";
import * as Hyper81 from "./JS/81tmp.hyper.js";
import * as InfinityCross from "./JS/InfinityCrossSVG.js";

function block(title, content) {
    const div = document.createElement("div");
    div.style.background = "#111";
    div.style.border = "1px solid #333";
    div.style.padding = "20px";
    div.style.margin = "20px 0";
    div.innerHTML = `<h2>${title}</h2><pre>${content}</pre>`;
    document.body.appendChild(div);
}

async function start() {

    // 1) Kernel prüfen
    const kernelFn = K81.Kernel3x81 || K81.Kernel81 || K81.default;
    if (!kernelFn) {
        block("❌ Kernel Fehler", "Kernel3x81 / Kernel81 nicht gefunden");
        return;
    }

    const atom = await kernelFn();
    block("Kernel Output", JSON.stringify(atom, null, 2));

    // 2) Rings
    if (Rings5D.AtomRings5D) {
        block("AtomRings5D", Rings5D.AtomRings5D());
    } else {
        block("❌ AtomRings5D", "Modul fehlt");
    }

    // 3) Orbit
    if (Orbit.Orbit48D) {
        block("Orbit48D", JSON.stringify(Orbit.Orbit48D(atom), null, 2));
    } else {
        block("❌ Orbit48D", "Modul fehlt");
    }

    // 4) Z-Axis
    if (ZAxis.Z_Axis) {
        block("Z_Axis", JSON.stringify(ZAxis.Z_Axis(atom), null, 2));
    } else {
        block("❌ Z_Axis", "Modul fehlt");
    }

    // 5) V-Axis
    if (VAxis.V_Axis) {
        block("V_Axis", JSON.stringify(VAxis.V_Axis(atom), null, 2));
    } else {
        block("❌ V_Axis", "Modul fehlt");
    }

    // 6) HyperMatrix
    if (Hyper81._81tmp_HyperMatrix) {
        const hyper = await Hyper81._81tmp_HyperMatrix();
        block("81tmp HyperMatrix", JSON.stringify(hyper, null, 2));
    } else {
        block("❌ HyperMatrix", "Modul fehlt");
    }

    // 7) InfinityCrossSVG
    if (InfinityCross.InfinityCrossSVG) {
        const svg = InfinityCross.InfinityCrossSVG();
        block("InfinityCrossSVG", svg.outerHTML || svg);
    } else {
        block("❌ InfinityCrossSVG", "Modul fehlt");
    }
}

start();
</script>
