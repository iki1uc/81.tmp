<script type="module">
import { Kernel3x81 } from "./JS/3×81.js";
import { AtomRings5D } from "./JS/AtomRings5D.js";
import { Orbit48D } from "./JS/Orbit48D.js";
import { Z_Axis } from "./JS/Z.axis.js";
import { V_Axis } from "./JS/V.axis.js";
import { _81tmp_HyperMatrix } from "./JS/81tmp.hyper.js";
import { InfinityCrossSVG } from "./JS/InfinityCrossSVG.js";

async function start() {
    const atom = await Kernel3x81();

    document.body.innerHTML += AtomRings5D();
    document.body.innerHTML += "<pre>" + JSON.stringify(Orbit48D(atom), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + JSON.stringify(Z_Axis(atom), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + JSON.stringify(V_Axis(atom), null, 2) + "</pre>";
    document.body.innerHTML += "<pre>" + JSON.stringify(await _81tmp_HyperMatrix(), null, 2) + "</pre>";
    document.body.innerHTML += InfinityCrossSVG();
}

start();
</script>
