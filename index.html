<script type="module">
import * as K81 from "./JS/3x81.js";
import * as Rings5D from "./JS/AtomRings5D.js";
import * as Orbit from "./JS/Orbit48D.js";
import * as ZAxis from "./JS/Z.axis.js";
import * as VAxis from "./JS/V.axis.js";
import * as Hyper81 from "./JS/81tmp.hyper.js";
import * as InfinityCross from "./JS/InfinityCrossSVG.js";

async function start() {

    // 1) Kernel prüfen
    const atom = await (K81.Kernel3x81 || K81.Kernel81 || K81.default)?.();
    if (!atom) {
        document.body.innerHTML += "<pre>❌ Kernel3x81 / Kernel81 nicht gefunden</pre>";
        return;
    }

    // 2) Rings
    if (Rings5D.AtomRings5D) {
        document.body.innerHTML += Rings5D.AtomRings5D();
    } else {
        document.body.innerHTML += "<pre>❌ AtomRings5D missing</pre>";
    }

    // 3) Orbit
    if (Orbit.Orbit48D) {
        document.body.innerHTML += "<pre>" + JSON.stringify(Orbit.Orbit48D(atom), null, 2) + "</pre>";
    } else {
        document.body.innerHTML += "<pre>❌ Orbit48D missing</pre>";
    }

    // 4) Z-Axis
    if (ZAxis.Z_Axis) {
        document.body.innerHTML += "<pre>" + JSON.stringify(ZAxis.Z_Axis(atom), null, 2) + "</pre>";
    } else {
        document.body.innerHTML += "<pre>❌ Z_Axis missing</pre>";
    }

    // 5) V-Axis
    if (VAxis.V_Axis) {
        document.body.innerHTML += "<pre>" + JSON.stringify(VAxis.V_Axis(atom), null, 2) + "</pre>";
    } else {
        document.body.innerHTML += "<pre>❌ V_Axis missing</pre>";
    }

    // 6) 81.tmp HyperMatrix
    if (Hyper81._81tmp_HyperMatrix) {
        const hyper = await Hyper81._81tmp_HyperMatrix();
        document.body.innerHTML += "<pre>" + JSON.stringify(hyper, null, 2) + "</pre>";
    } else {
        document.body.innerHTML += "<pre>❌ 81tmp HyperMatrix missing</pre>";
    }

    // 7) Infinity Cross (SVG)
    if (InfinityCross.InfinityCrossSVG) {
        const svg = InfinityCross.InfinityCrossSVG();
        document.body.innerHTML += svg.outerHTML || svg;
    } else {
        document.body.innerHTML += "<pre>❌ InfinityCrossSVG missing</pre>";
    }
}

start();
</script>
